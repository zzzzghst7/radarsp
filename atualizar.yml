name: ULTRON SP - Publicar painel de dados

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - data/sp_dashboard.json
      - .github/workflows/atualizar.yml

permissions:
  contents: read

concurrency:
  group: ultron-sp-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Conferir pacote e preparar site
        shell: bash
        run: |
          test -s index.html
          test -s data/sp_dashboard.json
          mkdir -p publicar/data
          cp index.html publicar/index.html
          cp data/sp_dashboard.json publicar/data/sp_dashboard.json
          touch publicar/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: publicar
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
