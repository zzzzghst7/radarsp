name: V5 - Resumo seguro de fiscalizacao SP
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar
        run: python -m unittest discover -p 'test_v5_*.py' -v
      - name: Sincronizar resumo estatistico (sem coordenadas publicadas)
        run: |
          if ! python atualizar_fontes.py; then
            echo '::warning::API externa indisponível; mantendo resumo anterior'
          fi
      - name: Salvar resumo se mudou
        run: |
          if [ -n "$(git status --porcelain data/resumo_fontes_sp.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/resumo_fontes_sp.json
            git commit -m 'dados: atualizar resumo SP V5'
            git push
          fi
      - name: Preparar apenas painel e resumo publico
        run: |
          mkdir -p publicar/data
          cp index.html publicar/index.html
          cp data/resumo_fontes_sp.json publicar/data/resumo_fontes_sp.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: publicar
      - id: deployment
        uses: actions/deploy-pages@v4
