name: Atualizar base pública CET-SP

on:
  workflow_dispatch:
  schedule:
    # 09:17 UTC = 06:17 em São Paulo (UTC-3)
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: sincronizacao-cetsp
  cancel-in-progress: false

jobs:
  sincronizar:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar nosso repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar testes do sincronizador
        run: python -m unittest -v

      - name: Verificar e sincronizar CSV da CET-SP
        run: python sincronizar_radares.py

      - name: Publicar somente quando os dados mudarem
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "dados: sincronizar CET-SP"
            git push
          else
            echo "Sem mudanças na base; nenhum commit."
          fi

      # Publicação opcional: habilite PUBLICAR_SITE=sim nas variáveis do repositório.
      - name: Preparar arquivos para o site
        if: ${{ vars.PUBLICAR_SITE == 'sim' }}
        shell: bash
        run: |
          mkdir -p publicar/data
          cp index.html localizacao.js tabela.html publicar/
          cp data/radares_ativos.csv data/radares_ativos.geojson data/resumo.json publicar/data/

      - name: Configurar GitHub Pages
        if: ${{ vars.PUBLICAR_SITE == 'sim' }}
        uses: actions/configure-pages@v5

      - name: Empacotar painel para Pages
        if: ${{ vars.PUBLICAR_SITE == 'sim' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: publicar

  publicar:
    if: ${{ vars.PUBLICAR_SITE == 'sim' }}
    needs: sincronizar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar painel
        id: deployment
        uses: actions/deploy-pages@v4
